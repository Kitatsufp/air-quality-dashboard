<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IAQ LIVE MONITOR · AI Prediction Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
--bg:#0a0c0f;--bg2:#111418;--bg3:#181d24;--border:#1e2630;
--text:#c8d8e8;--text-dim:#506070;--text-muted:#2a3a4a;
--green:#00e676;--green-dim:rgba(0,230,118,0.15);
--red:#ff4444;--yellow:#ffd740;--blue:#40c4ff;
--purple:#b388ff;--accent:#00e676;
--iaq-color:#40c4ff;--tvoc-color:#ffd740;
--eco2-color:#b388ff;--etoh-color:#ff7043;
--pred-color:rgba(255,68,68,0.8);--raw-color:#ffab40;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'JetBrains Mono',monospace;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
#loginWrap{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999}
#loginWrap.hidden{display:none}
.login-box{background:var(--bg2);border:1px solid var(--border);border-top:2px solid var(--green);padding:40px 36px;width:360px}
.login-box h1{font-family:'Space Mono',monospace;font-size:13px;letter-spacing:3px;color:var(--green);text-transform:uppercase;margin-bottom:6px}
.login-box p{color:var(--text-dim);font-size:11px;margin-bottom:32px}
.field{margin-bottom:18px}
.field label{display:block;font-size:10px;letter-spacing:2px;color:var(--text-dim);text-transform:uppercase;margin-bottom:8px}
.field input{width:100%;padding:10px 14px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:13px;outline:none;transition:border-color .2s}
.field input:focus{border-color:var(--green)}
.login-btn{width:100%;padding:12px;background:var(--green);color:#000;font-family:'Space Mono',monospace;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;border:none;cursor:pointer;transition:opacity .2s;margin-top:8px}
.login-btn:hover{opacity:.85}
.login-err{color:var(--red);font-size:11px;margin-top:12px;display:none}
#dashboard{display:none;min-height:100vh}
#dashboard.active{display:block}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:48px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.topbar-left{display:flex;align-items:center;gap:16px}
.live-dot{width:8px;height:8px;background:var(--green);border-radius:50%;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(0,230,118,.6)}50%{opacity:.8;box-shadow:0 0 0 6px rgba(0,230,118,0)}}
.topbar-title{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:2px;color:var(--text)}
.topbar-title span{color:var(--green)}
.topbar-right{display:flex;align-items:center;gap:16px}
.topbar-right input[type=date]{background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:11px;padding:5px 10px;outline:none;cursor:pointer}
#clockDisplay{font-size:12px;color:var(--green);letter-spacing:2px;min-width:70px;text-align:right}
.logout-btn{background:transparent;border:1px solid var(--border);color:var(--text-dim);font-family:'JetBrains Mono',monospace;font-size:10px;padding:5px 12px;cursor:pointer;letter-spacing:1px;transition:.2s}
.logout-btn:hover{border-color:var(--red);color:var(--red)}
.reload-badge{font-size:9px;color:var(--text-dim);letter-spacing:1px}
.reload-badge span{color:var(--green)}
.layout{display:grid;grid-template-columns:1fr 1fr 1fr 280px;grid-template-rows:auto auto;gap:1px;background:var(--border);min-height:calc(100vh - 48px)}
.panel{background:var(--bg2);padding:16px;position:relative}
.panel-iaq-main{grid-column:1/4;grid-row:1;padding:20px 24px}
.panel-stats{grid-column:4;grid-row:1/3;border-left:1px solid var(--border);display:flex;flex-direction:column}
.panel-tvoc{grid-column:1;grid-row:2}
.panel-eco2{grid-column:2;grid-row:2}
.panel-etoh{grid-column:3;grid-row:2}
.chart-wrap{position:relative}
.chart-wrap.main{height:200px}
.chart-wrap.sub{height:140px}
.overlay-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,12,15,.4);font-size:11px;color:var(--text-dim);letter-spacing:2px;display:none}
</style>
</head>
<body>
<div id="loginWrap">
<div class="login-box">
<h1>⬡ IAQ Monitor</h1>
<p>Air Quality · AI Prediction Dashboard</p>
<div class="field"><label>Email</label><input type="email" id="loginEmail"></div>
<div class="field"><label>Mật khẩu</label><input type="password" id="loginPass"></div>
<button class="login-btn" onclick="doLogin()">→ Đăng nhập</button>
<div class="login-err" id="loginErr"></div>
</div>
</div>

<div id="dashboard"></div>

<script>
const API='https://fastapi-web-3.onrender.com';
let token=null,user=null,charts={},reloadTimer=null,countdown=3;
let lastData={sensor:{},pred:{},raw:{}};
let currentTime=Date.now();
const PRED_SHIFT_SECONDS=60;

setInterval(()=>{
currentTime=Date.now();
document.getElementById('clockDisplay').textContent=
new Date().toLocaleTimeString('vi-VN',{hour12:false});
},1000);

async function doLogin(){
const email=document.getElementById('loginEmail').value;
const pass=document.getElementById('loginPass').value;
const err=document.getElementById('loginErr');
err.style.display='none';
try{
const fd=new FormData();
fd.append('username',email);
fd.append('password',pass);
const r=await fetch(`${API}/auth/login`,{method:'POST',body:fd});
if(!r.ok)throw new Error('Sai email hoặc mật khẩu');
const d=await r.json();
token=d.access_token;
user={email};
localStorage.setItem('aq_token',token);
localStorage.setItem('aq_user',JSON.stringify(user));
startDashboard();
}catch(e){
err.textContent='✗ '+e.message;
err.style.display='block';
}
}
</script>
</body>
</html>
