<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Quality Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 400px;
            margin: 0 auto;
            animation: slideUp 0.6s ease-out;
        }

        .login-container.hidden {
            display: none;
        }

        .login-container h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .dashboard {
            width: 100%;
            max-width: 1200px;
            display: none;
        }

        .dashboard.active {
            display: block;
            animation: fadeIn 0.6s ease-out;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-right {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .date-input {
            padding: 10px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
        }

        .logout-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(245, 87, 108, 0.3);
        }

        .user-info {
            color: #666;
            font-size: 14px;
        }

        .user-info strong {
            color: #333;
        }

        .chart-container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .chart-container h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .chart-wrapper {
            position: relative;
            height: 400px;
            margin-bottom: 20px;
        }

        .chart-legend {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #666;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 3px;
        }

        .legend-actual {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .legend-predict {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border-left: 5px solid #667eea;
        }

        .stat-card.predict {
            border-left-color: #f5576c;
        }

        .stat-card h3 {
            color: #999;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: bold;
            color: #333;
        }

        .stat-card .unit {
            color: #999;
            font-size: 14px;
            margin-top: 5px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 4px solid rgba(102, 126, 234, 0.1);
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: #fff3cd;
            color: #856404;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 5px solid #ffc107;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-right {
                width: 100%;
                flex-direction: column;
            }

            .chart-wrapper {
                height: 300px;
            }
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="login-container" id="loginContainer">
        <h1>🌍 Air Quality Monitor</h1>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Nhập email" required>
            </div>
            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu" required>
            </div>
            <button type="submit" class="login-btn">Đăng nhập</button>
        </form>
    </div>

    <div class="dashboard" id="dashboard">
        <div class="header">
            <div>
                <h1>📊 Air Quality Dashboard</h1>
                <div class="user-info">Xin chào, <strong id="userName">User</strong></div>
            </div>
            <div class="header-right">
                <input type="date" id="dateInput" class="date-input">
                <button class="logout-btn" onclick="logout()">Đăng xuất</button>
            </div>
        </div>

        <div id="errorMessage" class="error-message"></div>
        <div class="stats-container" id="statsContainer"></div>

        <div class="chart-container">
            <h2>📈 Dữ liệu chất lượng không khí</h2>
            <div class="chart-wrapper">
                <canvas id="comparisonChart"></canvas>
            </div>
            <div class="chart-legend">
                <div class="legend-item">
                    <div class="legend-color legend-actual"></div>
                    <span>Dữ liệu thực tế</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color legend-predict"></div>
                    <span>Dữ liệu dự đoán</span>
                </div>
            </div>
        </div>

        <div id="loadingMessage" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Đang tải dữ liệu...</p>
        </div>

        <div id="noDataMessage" class="no-data" style="display: none;">
            <p>📭 Không có dữ liệu cho ngày này</p>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'https://fastapi-web-3.onrender.com';
        let currentToken = null;
        let currentUser = null;
        let chart = null;

        // Khôi phục token từ localStorage khi trang load
        window.addEventListener('load', () => {
            const savedToken = localStorage.getItem('authToken');
            const savedUser = localStorage.getItem('currentUser');
            
            if (savedToken && savedUser) {
                currentToken = savedToken;
                currentUser = JSON.parse(savedUser);
                document.getElementById('userName').textContent = currentUser.name || currentUser.email;
                document.getElementById('dateInput').valueAsDate = new Date();
                showLogin(false);
                
                // Auto load dữ liệu
                loadChartData();
            } else {
                document.getElementById('dateInput').valueAsDate = new Date();
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                showLoading(true);
                const formData = new FormData();
                formData.append('username', email);
                formData.append('password', password);

                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('Đăng nhập thất bại');

                const data = await response.json();
                currentToken = data.access_token;
                
                const userResponse = await fetch(`${API_BASE_URL}/user/${email}`, {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });

                if (userResponse.ok) {
                    currentUser = await userResponse.json();
                    document.getElementById('userName').textContent = currentUser.name || email;
                    
                    // Lưu token và user vào localStorage
                    localStorage.setItem('authToken', currentToken);
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                }

                showLogin(false);
                loadChartData();
            } catch (error) {
                showError('❌ ' + error.message);
            } finally {
                showLoading(false);
            }
        });

        // Auto-load khi thay đổi ngày
        document.getElementById('dateInput').addEventListener('change', loadChartData);

        async function loadChartData() {
            if (!currentToken) return;

            try {
                showLoading(true);
                hideError();
                const selectedDate = document.getElementById('dateInput').value;

                const blogResponse = await fetch(
                    `${API_BASE_URL}/blog/daily?target_date=${selectedDate}`,
                    { headers: { 'Authorization': `Bearer ${currentToken}` } }
                );

                const predictResponse = await fetch(
                    `${API_BASE_URL}/Predict/daily?target_date=${selectedDate}`,
                    { headers: { 'Authorization': `Bearer ${currentToken}` } }
                );

                if (!blogResponse.ok || !predictResponse.ok) throw new Error('Failed');

                const blogData = await blogResponse.json();
                const predictData = await predictResponse.json();

                if (blogData.length === 0 && predictData.length === 0) {
                    showNoData();
                    updateStats([], []);
                } else {
                    updateChart(blogData, predictData);
                    updateStats(blogData, predictData);
                    hideNoData();
                }
            } catch (error) {
                showError('❌ ' + error.message);
            } finally {
                showLoading(false);
            }
        }

        function updateChart(blogData, predictData) {
            const ctx = document.getElementById('comparisonChart').getContext('2d');
            
            const blogTimes = blogData.map(d => d.time.substring(0, 5));
            const predictTimes = predictData.map(d => d.time.substring(0, 5));
            const allTimes = [...new Set([...blogTimes, ...predictTimes])].sort();

            const blogQuality = allTimes.map(time => {
                const found = blogData.find(d => d.time.substring(0, 5) === time);
                return found ? found.air_quality : null;
            });

            const predictQuality = allTimes.map(time => {
                const found = predictData.find(d => d.time.substring(0, 5) === time);
                return found ? found.air_quality : null;
            });

            if (chart) chart.destroy();

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: allTimes.length === 0 ? ['No data'] : allTimes,
                    datasets: [
                        {
                            label: 'Dữ liệu thực tế',
                            data: blogQuality,
                            borderColor: '#667eea',
                            backgroundColor: 'rgba(102, 126, 234, 0.1)',
                            borderWidth: 3,
                            fill: true,
                            tension: 0.4,
                            pointRadius: 5,
                            pointBackgroundColor: '#667eea',
                            pointBorderColor: '#fff',
                            pointBorderWidth: 2,
                        },
                        {
                            label: 'Dữ liệu dự đoán',
                            data: predictQuality,
                            borderColor: '#f5576c',
                            backgroundColor: 'rgba(245, 87, 108, 0.1)',
                            borderWidth: 3,
                            fill: true,
                            tension: 0.4,
                            pointRadius: 5,
                            pointBackgroundColor: '#f5576c',
                            pointBorderColor: '#fff',
                            pointBorderWidth: 2,
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            grid: { color: 'rgba(0, 0, 0, 0.05)' }
                        },
                        x: {
                            grid: { display: false }
                        }
                    }
                }
            });
        }

        function updateStats(blogData, predictData) {
            const statsContainer = document.getElementById('statsContainer');
            statsContainer.innerHTML = '';

            if (blogData.length > 0) {
                const avgBlog = (blogData.reduce((sum, d) => sum + d.air_quality, 0) / blogData.length).toFixed(1);
                const maxBlog = Math.max(...blogData.map(d => d.air_quality)).toFixed(1);
                const minBlog = Math.min(...blogData.map(d => d.air_quality)).toFixed(1);

                statsContainer.innerHTML += `
                    <div class="stat-card">
                        <h3>Trung bình (Thực tế)</h3>
                        <div class="value">${avgBlog}</div>
                        <div class="unit">µg/m³</div>
                    </div>
                    <div class="stat-card">
                        <h3>Cao nhất (Thực tế)</h3>
                        <div class="value">${maxBlog}</div>
                        <div class="unit">µg/m³</div>
                    </div>
                    <div class="stat-card">
                        <h3>Thấp nhất (Thực tế)</h3>
                        <div class="value">${minBlog}</div>
                        <div class="unit">µg/m³</div>
                    </div>
                `;
            }

            if (predictData.length > 0) {
                const avgPredict = (predictData.reduce((sum, d) => sum + d.air_quality, 0) / predictData.length).toFixed(1);
                const maxPredict = Math.max(...predictData.map(d => d.air_quality)).toFixed(1);
                const minPredict = Math.min(...predictData.map(d => d.air_quality)).toFixed(1);

                statsContainer.innerHTML += `
                    <div class="stat-card predict">
                        <h3>Trung bình (Dự đoán)</h3>
                        <div class="value">${avgPredict}</div>
                        <div class="unit">µg/m³</div>
                    </div>
                    <div class="stat-card predict">
                        <h3>Cao nhất (Dự đoán)</h3>
                        <div class="value">${maxPredict}</div>
                        <div class="unit">µg/m³</div>
                    </div>
                    <div class="stat-card predict">
                        <h3>Thấp nhất (Dự đoán)</h3>
                        <div class="value">${minPredict}</div>
                        <div class="unit">µg/m³</div>
                    </div>
                `;
            }
        }

        function showLogin(show) {
            document.getElementById('loginContainer').classList[show ? 'remove' : 'add']('hidden');
            document.getElementById('dashboard').classList[show ? 'remove' : 'add']('active');
        }

        function showLoading(show) {
            document.getElementById('loadingMessage').style.display = show ? 'block' : 'none';
        }

        function showNoData() {
            document.getElementById('noDataMessage').style.display = 'block';
            document.querySelector('.chart-wrapper').style.display = 'none';
        }

        function hideNoData() {
            document.getElementById('noDataMessage').style.display = 'none';
            document.querySelector('.chart-wrapper').style.display = 'block';
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
        }

        function hideError() {
            document.getElementById('errorMessage').classList.remove('show');
        }

        function logout() {
            currentToken = null;
            currentUser = null;
            
            // Xóa token từ localStorage
            localStorage.removeItem('authToken');
            localStorage.removeItem('currentUser');
            
            showLogin(true);
            document.getElementById('loginForm').reset();
            if (chart) chart.destroy();
        }
    </script>
</body>
</html>
