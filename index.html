<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air Quality Dashboard - 4 Metrics</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 400px;
            margin: 0 auto;
            animation: slideUp 0.6s ease-out;
        }

        .login-container.hidden {
            display: none;
        }

        .login-container h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .dashboard {
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            display: none;
        }

        .dashboard.active {
            display: block;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-right {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .date-input {
            padding: 10px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
        }

        .logout-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(245, 87, 108, 0.3);
        }

        .user-info {
            color: #666;
            font-size: 14px;
        }

        .user-info strong {
            color: #333;
        }

        /* 4-Column Grid for Charts */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border-top: 4px solid;
        }

        .chart-card.iaq {
            border-top-color: #667eea;
        }

        .chart-card.tvoc {
            border-top-color: #f093fb;
        }

        .chart-card.eco2 {
            border-top-color: #17c684;
        }

        .chart-card.etoh {
            border-top-color: #ffa500;
        }

        .chart-card h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .metric-icon {
            font-size: 24px;
            width: 32px;
            text-align: center;
        }

        .chart-wrapper {
            position: relative;
            height: 280px;
            margin-bottom: 15px;
        }

        .metric-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            font-size: 11px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .stat-unit {
            font-size: 10px;
            color: #bbb;
            margin-top: 2px;
        }

        .no-data {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 4px solid rgba(102, 126, 234, 0.1);
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: #fff3cd;
            color: #856404;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 5px solid #ffc107;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 1200px) {
            .charts-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-right {
                width: 100%;
                flex-direction: column;
            }

            .chart-wrapper {
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container" id="loginContainer">
        <h1>🌍 Air Quality Monitor</h1>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Nhập email" required>
            </div>
            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu" required>
            </div>
            <button type="submit" class="login-btn">Đăng nhập</button>
        </form>
    </div>

    <div class="dashboard" id="dashboard">
        <div class="header">
            <div>
                <h1>📊 Air Quality Dashboard</h1>
                <div class="user-info">Xin chào, <strong id="userName">User</strong></div>
            </div>
            <div class="header-right">
                <input type="date" id="dateInput" class="date-input">
                <button class="logout-btn" onclick="logout()">Đăng xuất</button>
            </div>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <div class="charts-grid">
            <!-- IAQ Chart -->
            <div class="chart-card iaq">
                <h2>
                    <span class="metric-icon">💨</span>
                    IAQ
                </h2>
                <div class="chart-wrapper">
                    <canvas id="iaqChart"></canvas>
                </div>
                <div class="metric-stats">
                    <div class="stat">
                        <div class="stat-label">Avg</div>
                        <div class="stat-value" id="iaqAvg">-</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Max</div>
                        <div class="stat-value" id="iaqMax">-</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Min</div>
                        <div class="stat-value" id="iaqMin">-</div>
                    </div>
                </div>
            </div>

            <!-- TVOC Chart -->
            <div class="chart-card tvoc">
                <h2>
                    <span class="metric-icon">🌬️</span>
                    TVOC
                </h2>
                <div class="chart-wrapper">
                    <canvas id="tvocChart"></canvas>
                </div>
                <div class="metric-stats">
                    <div class="stat">
                        <div class="stat-label">Avg</div>
                        <div class="stat-value" id="tvocAvg">-</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Max</div>
                        <div class="stat-value" id="tvocMax">-</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Min</div>
                        <div class="stat-value" id="tvocMin">-</div>
                    </div>
                </div>
            </div>

            <!-- eCO2 Chart -->
            <div class="chart-card eco2">
                <h2>
                    <span class="metric-icon">🔬</span>
                    eCO₂
                </h2>
                <div class="chart-wrapper">
                    <canvas id="eco2Chart"></canvas>
                </div>
                <div class="metric-stats">
                    <div class="stat">
                        <div class="stat-label">Avg</div>
                        <div class="stat-value" id="eco2Avg">-</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Max</div>
                        <div class="stat-value" id="eco2Max">-</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Min</div>
                        <div class="stat-value" id="eco2Min">-</div>
                    </div>
                </div>
            </div>

            <!-- EtOH Chart -->
            <div class="chart-card etoh">
                <h2>
                    <span class="metric-icon">🍷</span>
                    EtOH
                </h2>
                <div class="chart-wrapper">
                    <canvas id="etohChart"></canvas>
                </div>
                <div class="metric-stats">
                    <div class="stat">
                        <div class="stat-label">Avg</div>
                        <div class="stat-value" id="etohAvg">-</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Max</div>
                        <div class="stat-value" id="etohMax">-</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Min</div>
                        <div class="stat-value" id="etohMin">-</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="noDataMessage" class="no-data" style="display: none;">
            <p>📭 Không có dữ liệu cho ngày này</p>
        </div>

        <div id="loadingMessage" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Đang tải dữ liệu...</p>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'https://fastapi-web-3.onrender.com';
        let currentToken = null;
        let currentUser = null;
        const charts = {
            iaq: null,
            tvoc: null,
            eco2: null,
            etoh: null
        };

        // Color schemes for each metric
        const colors = {
            iaq: { border: '#667eea', bg: 'rgba(102, 126, 234, 0.1)' },
            tvoc: { border: '#f093fb', bg: 'rgba(240, 147, 251, 0.1)' },
            eco2: { border: '#17c684', bg: 'rgba(23, 198, 132, 0.1)' },
            etoh: { border: '#ffa500', bg: 'rgba(255, 165, 0, 0.1)' }
        };

        function restoreSession() {
            const savedToken = localStorage.getItem('authToken');
            const savedUser = localStorage.getItem('currentUser');
            
            if (savedToken && savedUser) {
                try {
                    currentToken = savedToken;
                    currentUser = JSON.parse(savedUser);
                    document.getElementById('userName').textContent = currentUser.name || currentUser.email;
                    document.getElementById('dateInput').valueAsDate = new Date();
                    showLogin(false);
                    loadChartData();
                    return true;
                } catch (e) {
                    console.error('Error restoring session:', e);
                    localStorage.removeItem('authToken');
                    localStorage.removeItem('currentUser');
                    return false;
                }
            }
            return false;
        }

        window.addEventListener('load', () => {
            document.getElementById('dateInput').valueAsDate = new Date();
            if (!restoreSession()) {
                showLogin(true);
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                showLoading(true);
                hideError();
                const formData = new FormData();
                formData.append('username', email);
                formData.append('password', password);

                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('Login failed');

                const data = await response.json();
                currentToken = data.access_token;
                
                const userResponse = await fetch(`${API_BASE_URL}/user/${email}`, {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });

                if (userResponse.ok) {
                    currentUser = await userResponse.json();
                    document.getElementById('userName').textContent = currentUser.name || email;
                    
                    localStorage.setItem('authToken', currentToken);
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                }

                showLogin(false);
                loadChartData();
            } catch (error) {
                showError('❌ ' + error.message);
            } finally {
                showLoading(false);
            }
        });

        document.getElementById('dateInput').addEventListener('change', () => {
            loadChartData();
        });

        async function loadChartData() {
            if (!currentToken) return;

            try {
                showLoading(true);
                hideError();
                const selectedDate = document.getElementById('dateInput').value;

                // Fetch sensor data (thực tế)
                const sensorResponse = await fetch(
                    `${API_BASE_URL}/sensors/all?target_date=${selectedDate}`,
                    { headers: { 'Authorization': `Bearer ${currentToken}` } }
                );

                // Fetch prediction data
                const predictionResponse = await fetch(
                    `${API_BASE_URL}/predictions/all?target_date=${selectedDate}`,
                    { headers: { 'Authorization': `Bearer ${currentToken}` } }
                );

                if (!sensorResponse.ok || !predictionResponse.ok) {
                    throw new Error('Failed to fetch data');
                }

                const sensorData = await sensorResponse.json();
                const predictionData = await predictionResponse.json();

                // Check if we have any data
                const hasData = Object.values(sensorData).some(arr => arr.length > 0) ||
                               Object.values(predictionData).some(arr => arr.length > 0);

                if (!hasData) {
                    showNoData();
                } else {
                    hideNoData();
                    updateAllCharts(sensorData, predictionData);
                }
            } catch (error) {
                showError('❌ ' + error.message);
            } finally {
                showLoading(false);
            }
        }

        function updateAllCharts(sensorData, predictionData) {
            // Update each metric's chart
            ['iaq', 'tvoc', 'eco2', 'etoh'].forEach(metric => {
                const sensorPoints = sensorData[metric] || [];
                const predictionPoints = predictionData[metric] || [];
                updateChart(metric, sensorPoints, predictionPoints);
                updateStats(metric, sensorPoints);
            });
        }

        function updateChart(metric, sensorPoints, predictionPoints) {
            const times = [...new Set([
                ...sensorPoints.map(p => p.time),
                ...predictionPoints.map(p => p.time)
            ])].sort();

            const sensorValues = times.map(t => {
                const found = sensorPoints.find(p => p.time === t);
                return found ? found.value : null;
            });

            const predictionValues = times.map(t => {
                const found = predictionPoints.find(p => p.time === t);
                return found ? found.value : null;
            });

            const ctx = document.getElementById(`${metric}Chart`).getContext('2d');
            
            if (charts[metric]) charts[metric].destroy();

            charts[metric] = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: times,
                    datasets: [
                        {
                            label: 'Thực tế',
                            data: sensorValues,
                            borderColor: colors[metric].border,
                            backgroundColor: colors[metric].bg,
                            borderWidth: 2,
                            fill: true,
                            tension: 0.3,
                            pointRadius: 4,
                            pointBackgroundColor: colors[metric].border,
                            pointBorderColor: '#fff',
                            pointBorderWidth: 1,
                        },
                        {
                            label: 'Dự đoán',
                            data: predictionValues,
                            borderColor: colors[metric].border,
                            borderDash: [5, 5],
                            backgroundColor: 'transparent',
                            borderWidth: 2,
                            fill: false,
                            tension: 0.3,
                            pointRadius: 3,
                            pointBackgroundColor: colors[metric].border,
                            pointBorderColor: '#fff',
                            pointBorderWidth: 1,
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: { beginAtZero: true },
                        x: { display: false }
                    }
                }
            });
        }

        function updateStats(metric, data) {
            if (data.length === 0) {
                document.getElementById(`${metric}Avg`).textContent = '-';
                document.getElementById(`${metric}Max`).textContent = '-';
                document.getElementById(`${metric}Min`).textContent = '-';
                return;
            }

            const values = data.map(p => p.value);
            const avg = (values.reduce((a, b) => a + b, 0) / values.length).toFixed(1);
            const max = Math.max(...values).toFixed(1);
            const min = Math.min(...values).toFixed(1);

            document.getElementById(`${metric}Avg`).textContent = avg;
            document.getElementById(`${metric}Max`).textContent = max;
            document.getElementById(`${metric}Min`).textContent = min;
        }

        function showLogin(show) {
            document.getElementById('loginContainer').classList[show ? 'remove' : 'add']('hidden');
            document.getElementById('dashboard').classList[show ? 'remove' : 'add']('active');
        }

        function showLoading(show) {
            document.getElementById('loadingMessage').style.display = show ? 'block' : 'none';
        }

        function showNoData() {
            document.getElementById('noDataMessage').style.display = 'block';
            document.querySelector('.charts-grid').style.display = 'none';
        }

        function hideNoData() {
            document.getElementById('noDataMessage').style.display = 'none';
            document.querySelector('.charts-grid').style.display = 'grid';
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
        }

        function hideError() {
            document.getElementById('errorMessage').classList.remove('show');
        }

        function logout() {
            currentToken = null;
            currentUser = null;
            
            localStorage.removeItem('authToken');
            localStorage.removeItem('currentUser');
            
            Object.values(charts).forEach(chart => {
                if (chart) chart.destroy();
            });

            showLogin(true);
            document.getElementById('loginForm').reset();
        }
    </script>
</body>
</html>
